<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario CSS</title>
    <link href="img/4img.png" rel="shortcut icon" type="image/png">
   
    <!--css interno-->
    <style>
        label, input, select {
            margin: 20px 0px;
        }
        input, select {
            border: 0px;
            border-bottom: 2px solid black;
            outline: none;
            transition: 0.4s ease;
            width: 100%;
        }

        input:focus, select:focus {
            border-bottom: 2px solid red;
            transition: 0.4s ease;
        }
        div {
            margin-right: 5%;
            margin-top: 50px;
            float: left;
        }

        label, input {
            margin: 20px 0px;
        }

        input {
            border: 0px;
            border-bottom: 1px solid black ;
            outline: none;
            transition: 0.3s ease;
            width: 100%;
        }

        input:focus {
            border-bottom: 3px solid rgb(169, 32, 4);
            transition: 0.4s ease;
            width: 100%;
        }

        select {
            background-color: white;
        }

        button{
            width: 200px;
            height: 40px;
            font-size: 25px;
            font-weight: bolder;
            border-radius: 15px;
            color: aliceblue;
            background-color: black;
            transition: 0.4s ease;
        }

        button:hover {
            background-color: blueviolet;
            transition: 0.3s ease;

        }

        img {
            display: block;
            margin: 0 auto;
            justify-content: center; /* horizontal */
            align-items: center;   
}

    </style>
</head>
<body style="font-family: 'Courier', Courier, Arial, Helvetica, sans-serif;margin: 0px auto;">

    <header Style="background-color: black;color: aliceblue;display: flex;justify-content: center;">

        <h1>Formulario com CSS</h1>

        

    </header>

    <form style="margin: 50px 100px; max-width: 100%;">

        <img src="img/img5.jpg" alt="front" width="270">

            <div style="width: 20%;">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>
            </div>

            <div style="width: 70%;">
            <label for="Sobrenome">Sobrenome:</label>    
            <input type="text" id="sobrenome" name="sobrenome"required>
            </div>

            <div style="width: 45%;">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
           
            </div>
            <div style="width: 20%;">
                <label for="dataNascimento">Data de nascimento</label> 
                <input type="date" id="dataNascimento" nome="dataNascimento">
            </div>
                <div style="width:20%;">
                    <label for="genero">Gênero:</label>
                    <select id="genero" name="genero">
                    <option value="">Escolha uma opção...</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Outro">Outro</option>
                </select>
                </div>
                <div style="display: flex; justify-content: center; width: 100%; margin: 100px 0px;">
                <button type="submit">Cadastrar</button>
            </div>
        </label>
    </form>
</body>
</html>
